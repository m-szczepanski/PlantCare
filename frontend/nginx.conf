server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/health {
        proxy_pass http://api:8080/health;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Default is 1m, which rejected photo uploads with a bare 413 before the
        # request reached the API; keep above the API's own 5 MB cap.
        client_max_body_size 10m;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /calendar.ics {
        proxy_pass http://api:8080/api/calendar.ics;
    }

    location /openapi/ {
        proxy_pass http://api:8080;
    }

    location /uploads/ {
        try_files $uri =404;
    }

    location /assets/ {
        # Content-hashed filenames from the Vite build - safe to cache forever.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Always revalidate the SPA shell, otherwise browsers keep serving a
        # stale index.html that points at deleted asset bundles ("old UI"
        # after a redeploy despite the container running the new image).
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
