services:
  api:
    build: ./backend/PlantCare.Api
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${DB_CONNECTIONSTRING:-Data Source=/data/plantcare.db}
      PHOTO_STORAGE_PATH: /data/uploads
    volumes:
      - plant-data:/data
      - plant-photos:/data/uploads
    ports:
      - "5001:8080"

  web:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - plant-photos:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports:
      - "8080:80"
    volumes:
      - ntfy-data:/var/lib/ntfy

volumes:
  plant-data:
  plant-photos:
  ntfy-data:
