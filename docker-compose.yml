services:
  api:
    build: ./backend/PlantCare.Api
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TZ:-UTC}
      ConnectionStrings__Default: ${DB_CONNECTIONSTRING:-Data Source=/data/plantcare.db}
      PHOTO_STORAGE_PATH: /data/uploads
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
      NTFY_TOPIC: ${NTFY_TOPIC:-plant-care}
      NTFY_PUBLIC_PORT: ${NTFY_PUBLIC_PORT:-8080}
    volumes:
      - plant-data:/data
      - plant-photos:/data/uploads
    ports:
      - "5001:8080"

  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: plantcare
      POSTGRES_USER: plantcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantcare-dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantcare -d plantcare"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - plant-photos:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_PUBLIC_PORT:-8080}:80"
    volumes:
      - ntfy-data:/var/lib/ntfy

volumes:
  plant-data:
  plant-photos:
  pg-data:
  ntfy-data:
